<!doctype html><html><head><meta charset="utf-8"><title>Employee Directory</title><style>body{font:16px Arial;max-width:760px;margin:40px auto;color:#243247}input,button{padding:9px;margin:5px}li{padding:8px;background:#eef3f8;margin:5px}</style></head><body><h1>Employee Directory</h1><p>Frontend → API → PostgreSQL</p><form id="f"><input id="name" placeholder="Name" required><input id="dept" placeholder="Department" required><input id="email" type="email" placeholder="Email" required><button>Add employee</button></form><button onclick="load()">Refresh</button><ul id="list"></ul><p id="status"></p><script>
async function load(){try{let r=await fetch('/api/employees');if(!r.ok)throw Error(await r.text());let a=await r.json();document.querySelector('#list').innerHTML=a.map(e=>`<li>${e.id}: ${e.name} — ${e.department} — ${e.email}</li>`).join('');status.textContent=`Loaded ${a.length} employee(s)`}catch(e){status.textContent='API error: '+e}}
f.onsubmit=async e=>{e.preventDefault();let body={name:name.value,department:dept.value,email:email.value};let r=await fetch('/api/employees',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});status.textContent=r.ok?'Employee added':'Error: '+await r.text();if(r.ok){f.reset();load()}};load();
</script></body></html>
