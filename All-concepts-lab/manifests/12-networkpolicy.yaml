# NetworkPolicy requires CNI enforcement. Ingress permitted from frontend/worker labels.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: employee-api-ingress, namespace: employee-platform}
spec:
 podSelector: {matchLabels: {app: employee-api}}
 policyTypes: [Ingress]
 ingress:
 - from:
   - podSelector: {matchLabels: {app: employee-frontend}}
   - podSelector: {matchLabels: {app: employee-worker}}
   ports: [{protocol: TCP, port: 5000}]
