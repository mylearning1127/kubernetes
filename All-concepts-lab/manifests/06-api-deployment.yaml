apiVersion: apps/v1
kind: Deployment
metadata: {name: employee-api, namespace: employee-platform}
spec:
 replicas: 2
 strategy: {type: RollingUpdate, rollingUpdate: {maxSurge: 1, maxUnavailable: 0}}
 selector: {matchLabels: {app: employee-api}}
 template:
  metadata: {labels: {app: employee-api, tier: backend}}
  spec:
   serviceAccountName: employee-app
   initContainers:
   - name: wait-for-database
     image: postgres:16-alpine
     command: ["sh","-c","until pg_isready -h employee-postgres -p 5432; do echo waiting; sleep 2; done"]
   containers:
   - name: api
     image: employee-api:1.0
     imagePullPolicy: IfNotPresent
     ports: [{containerPort: 5000}]
     envFrom: [{configMapRef: {name: employee-config}}]
     env: [{name: DB_PASSWORD, valueFrom: {secretKeyRef: {name: employee-db-secret, key: DB_PASSWORD}}}]
     command: ["sh","-c","python -c 'from app import init_db; init_db()' && python app.py"]
     readinessProbe: {httpGet: {path: /ready, port: 5000}, initialDelaySeconds: 5, periodSeconds: 5}
     livenessProbe: {httpGet: {path: /health, port: 5000}, initialDelaySeconds: 15, periodSeconds: 10}
     startupProbe: {httpGet: {path: /health, port: 5000}, failureThreshold: 30, periodSeconds: 2}
     resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 256Mi}}
