apiVersion: apps/v1
kind: StatefulSet
metadata: {name: employee-postgres, namespace: employee-platform}
spec:
 serviceName: employee-postgres
 replicas: 1
 selector: {matchLabels: {app: employee-postgres}}
 template:
  metadata: {labels: {app: employee-postgres}}
  spec:
   containers:
   - name: postgres
     image: postgres:16-alpine
     ports: [{containerPort: 5432}]
     env:
     - {name: POSTGRES_DB, valueFrom: {configMapKeyRef: {name: employee-config, key: DB_NAME}}}
     - {name: POSTGRES_USER, valueFrom: {configMapKeyRef: {name: employee-config, key: DB_USER}}}
     - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: employee-db-secret, key: POSTGRES_PASSWORD}}}
     volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
     readinessProbe: {exec: {command: ["sh","-c","pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]}, initialDelaySeconds: 10, periodSeconds: 5}
     livenessProbe: {exec: {command: ["sh","-c","pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]}, initialDelaySeconds: 30, periodSeconds: 10}
     resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
   volumes: [{name: data, persistentVolumeClaim: {claimName: employee-postgres-data}}]
