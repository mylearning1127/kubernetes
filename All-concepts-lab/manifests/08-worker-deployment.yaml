apiVersion: apps/v1
kind: Deployment
metadata: {name: employee-worker, namespace: employee-platform}
spec:
 replicas: 1
 selector: {matchLabels: {app: employee-worker}}
 template:
  metadata: {labels: {app: employee-worker, tier: background}}
  spec:
   containers:
   - name: worker
     image: employee-worker:1.0
     imagePullPolicy: IfNotPresent
     resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 200m, memory: 128Mi}}
