apiVersion: v1
kind: Service
metadata: {name: employee-postgres, namespace: employee-platform}
spec:
 clusterIP: None
 selector: {app: employee-postgres}
 ports: [{name: postgres, port: 5432, targetPort: 5432}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: employee-postgres-data, namespace: employee-platform}
spec:
 accessModes: [ReadWriteOnce]
 resources: {requests: {storage: 1Gi}}
