apiVersion: v1
kind: ServiceAccount
metadata: {name: employee-app, namespace: employee-platform}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: employee-read-pods, namespace: employee-platform}
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get","list","watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: employee-read-pods-binding, namespace: employee-platform}
subjects: [{kind: ServiceAccount, name: employee-app, namespace: employee-platform}]
roleRef: {kind: Role, name: employee-read-pods, apiGroup: rbac.authorization.k8s.io}
