apiVersion: batch/v1
kind: Job
metadata: {name: employee-one-time-job, namespace: employee-platform}
spec:
 backoffLimit: 2
 template:
  metadata: {labels: {app: employee-one-time-job}}
  spec:
   restartPolicy: Never
   containers: [{name: task, image: busybox:1.36, command: ["sh","-c","echo One-time task finished; date"]}]
