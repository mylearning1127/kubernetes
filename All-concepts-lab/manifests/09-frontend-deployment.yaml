apiVersion: apps/v1
kind: Deployment
metadata: {name: employee-frontend, namespace: employee-platform}
spec:
 replicas: 2
 selector: {matchLabels: {app: employee-frontend}}
 template:
  metadata: {labels: {app: employee-frontend, tier: frontend}}
  spec:
   containers:
   - name: nginx
     image: employee-frontend:1.0
     imagePullPolicy: IfNotPresent
     ports: [{containerPort: 80}]
     readinessProbe: {httpGet: {path: /, port: 80}, initialDelaySeconds: 3, periodSeconds: 5}
     livenessProbe: {httpGet: {path: /, port: 80}, initialDelaySeconds: 10, periodSeconds: 10}
     resources: {requests: {cpu: 100m, memory: 64Mi}, limits: {cpu: 300m, memory: 128Mi}}
