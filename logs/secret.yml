==============================================================
Injecting secret into Pods
=============================================================
[kubeuser@medGPT 10-secrets]$ k get pods
No resources found in default namespace.
[kubeuser@medGPT 10-secrets]$
[kubeuser@medGPT 10-secrets]$ k get secret
NAME        TYPE     DATA   AGE
db-secret   opaque   2      6m56s
[kubeuser@medGPT 10-secrets]$
[kubeuser@medGPT 10-secrets]$ cat inject-secret-into-pod.yml
apiVersion: v1
kind: Pod
metadata:
  name: secret-inject-container
spec:
 containers:
   - name: container-nginx
     image: nginx
     envFrom:
       - secretRef:
            name: db-secret

[kubeuser@medGPT 10-secrets]$
[kubeuser@medGPT 10-secrets]$ k apply -f inject-secret-into-pod.yml
pod/secret-inject-container created
[kubeuser@medGPT 10-secrets]$
[kubeuser@medGPT 10-secrets]$ k get pods
