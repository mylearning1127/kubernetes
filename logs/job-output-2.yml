[root@minikube manifest]# cat 16-01-job-additional-option.yml
apiVersion: batch/v1
kind: Job

metadata:
  name: reconciliation-job

spec:
  completions: 3
  parallelism: 2
  backoffLimit: 3

  template:
    metadata:
      labels:
        app: reconciliation

    spec:
      restartPolicy: Never

      containers:
        - name: reconciliation
          image: busybox:1.36

          command:
            - sh
            - -c
            - |
              echo "Starting transaction reconciliation"
              sleep 20
              echo "Checking payment transactions"
              echo "Reconciliation completed"
[root@minikube manifest]#


[root@minikube manifest]# k apply -f 16-01-job-additional-option.yml
job.batch/reconciliation-job created
[root@minikube manifest]#

