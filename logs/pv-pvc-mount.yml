apiVersion: v1
kind: Pod
metadata:
  name: pod-with-pvc
spec:
 containers:
  - name: container1
    image: nginx
    volumeMounts:
    - name: pvc-1
      path: /flink
 volumes:
  - name: pvc-1
    persistentVolumeClaim:
      claimName: web-pvc
