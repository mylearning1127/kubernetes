[kubeuser@medGPT 11-Storage]$


[kubeuser@medGPT 11-Storage]$ cat 03-pvc-create.yml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: web-pvc
spec:
  storageClassName: ""
  accessModes:
    - ReadWriteOnce

  resources:
    requests:
      storage: 2Mi

  volumeName: web-pv
[kubeuser@medGPT 11-Storage]$


[kubeuser@medGPT 11-Storage]$ k apply -f 03-pvc-create.yml
persistentvolumeclaim/web-pvc created
