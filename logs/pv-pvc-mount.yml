============================================================================================================================
PV CREATION

Important: PVC and PV binding is normally one-to-one. One PV cannot be independently bound to multiple PVCs at the same time.
============================================================================================================================

[kubeuser@medGPT 11-Storage]$ cat 02-pv-create.yml
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-web
spec:
 capacity:
   storage: 2Mi
 accessModes:
   - ReadWriteOnce
 persistentVolumeReclaimPolicy: Retain
 hostPath:
  path: /mnt/data/app1
  type: DirectoryOrCreate
[kubeuser@medGPT 11-Storage]$


[kubeuser@medGPT 11-Storage]$ k get pv
No resources found
[kubeuser@medGPT 11-Storage]$


[kubeuser@medGPT 11-Storage]$ k apply -f 02-pv-create.yml
