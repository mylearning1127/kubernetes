======================================================================
Configuring HPA
      NOTE: replica mentioned as 2 but in HPA min POD=3
======================================================================

[root@minikube HPA-Horizontal-Pod-Autoscaler]# cat 02-hpa.yml
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: bank-hpa

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bank-app

  minReplicas: 3
  maxReplicas: 5

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
