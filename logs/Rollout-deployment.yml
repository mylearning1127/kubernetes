[root@minikube manifest]# cat 19-rolling-update.yml
apiVersion: apps/v1
kind: Deployment

metadata:
  name: bank-app

spec:
  replicas: 3

  selector:
    matchLabels:
      app: bank

  strategy:
    type: RollingUpdate

    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: bank

    spec:
      containers:
        - name: nginx
          image: nginx:1.28

          ports:
            - containerPort: 80

          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
