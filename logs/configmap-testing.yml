================================================================
Aaccess specific variable in YML
================================================================
[kubeuser@medGPT 09-configmap]$ cat 02-pod-env-variable.yml
apiVersion: v1
kind: Pod
metadata:
  name: var-via-env-specific
spec:
 containers:
 - name: web-container
   image: nginx
   env:
    - name: DATABASE_HOST
      valueFrom:
        configMapKeyRef:
          name: db-config
          key: DB_HOST
