============================================================================
ConfigMap as mounted volume
===========================================================================
[kubeuser@medGPT 09-configmap]$ cat 03-configmap-as-mountedfile.yml
apiVersion: v1
kind: Pod
metadata:
  name: config-file-pod
spec:
  containers:
    - name: nginx
      image: nginx:1.28
      volumeMounts:
        - name: config-volume
          mountPath: /etc/db-config
  volumes:
    - name: config-volume
      configMap:
        name: db-config
