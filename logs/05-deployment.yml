       app: GPT
  strategy:
    type: RollingUpdate
    rollingUpdate:
       maxSurge: 1
       maxUnavailable: 0
  template:
    metadata:
      labels:
        app: GPT
    spec:
      containers:
       - name: deplyment-container
         image: nginx
         ports:
          - containerPort: 80
