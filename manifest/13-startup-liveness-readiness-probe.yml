apiVersion: apps/v1
kind: Deployment
metadata:
  name: startup-liveness-readiness-testing
spec:
  replicas: 3
  selector:
    matchLabels:
       app: probe-testing
  template:
    metadata:
      labels:
         app: probe-testing
    spec:
     containers:
     - name: web-container
       image: nginx
       ports:
       - containerPort: 80

       startupProbe:
         httpGet:
           path: /
           port: 80
         periodSeconds: 10
         failureThreshold: 15

       livenessProbe:
         httpGet:
           path: /
           port: 80
         periodSeconds: 10
         failureThreshold: 3

       readinessProbe:
         httpGet:
           path: /
           port: 80
         periodSeconds: 5
         failureThreshold: 2

