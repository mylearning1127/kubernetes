
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bank-app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: bank-app

  template:
    metadata:
      labels:
        app: bank-app

    spec:
      containers:
        - name: bank-container
          image: registry.k8s.io/hpa-example
          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: 200m
              memory: 100Mi

            limits:
              cpu: 500m
              memory: 200Mi
---
apiVersion: v1
kind: Service
metadata:
  name: bank-app
spec:
  selector:
    app: bank-app
  ports:
    - port: 80
      targetPort: 80
