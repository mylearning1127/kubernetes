apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: replica-set1
spec:
  replicas: 2
  selector: 
    matchLabels:
        app: demoapp
  template:
    metadata:
      labels:
        app: demoapp
    spec:
      containers:
      - name: replicacontainer
        image: nginx
        ports:
         - containerPort: 80 
