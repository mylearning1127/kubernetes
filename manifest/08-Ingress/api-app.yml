apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api-container
          image: hashicorp/http-echo:1.0.0
          args:
            - "-text=Welcome to Banking API"
          ports:
            - containerPort: 5678
