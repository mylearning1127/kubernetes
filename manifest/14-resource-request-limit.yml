apiVersion: apps/v1
kind: Deployment
metadata:
  name: resource-allocation
spec:
  replicas: 2
  selector:
    matchLabels:
       app: resource-testing
  template:
     metadata:
        labels:
          app: resource-testing
     spec:
       containers:
       - name: conatiner-1
         image: nginx
         
         resources:
           requests:
             cpu: "100m"
             memory: "128Mi"

           limits:
             cpu: "200m"
             memory: "256Mi"
