apiVersion: v1
kind: Pod
metadata:
  name: secret-file-pod
spec:
  containers:
    - name: nginx
      image: nginx:1.28
      volumeMounts:
        - name: secret-volume
          mountPath: /etc/bank-secrets
          readOnly: true
  volumes:
    - name: secret-volume
      secret:
        secretName: bank-secret
