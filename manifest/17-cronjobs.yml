apiVersion: batch/v1
kind: CronJob

metadata:
  name: daily-reconciliation

spec:
  schedule: "*/2 * * * *"

  concurrencyPolicy: Forbid

  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 2

  jobTemplate:
    spec:
      backoffLimit: 2

      template:
        spec:
          restartPolicy: Never

          containers:
            - name: reconciliation
              image: busybox:1.36

              command:
                - sh
                - -c
                - |
                  echo "Daily reconciliation started"
                  date
                  sleep 10
                  echo "Daily reconciliation completed"
