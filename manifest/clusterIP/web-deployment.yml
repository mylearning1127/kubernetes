apiVersion: apps/v1
kind: Deployment
metadata:
  name: eb-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web-demo
  template:
    metadata:
      labels:
        app: web-demo
    spec:
      containers:
       - name: ngnx
         image: nginx
         ports:
          - containerPort: 85
