# One PostgreSQL instance for this small lab. Not HA and not production-ready.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: employee-postgres
  namespace: employee-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: employee-postgres
  template:
    metadata:
      labels:
        app: employee-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: employee-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: employee-db-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: employee-db-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: database
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: database
          persistentVolumeClaim:
            claimName: employee-postgres-pvc
