apiVersion: batch/v1
kind: CronJob
metadata:
  name: employee-daily-report
  namespace: employee-platform
spec:
  schedule: "30 8 * * *"
  timeZone: "Asia/Kolkata"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: report
              image: busybox:1.36
              command: ["sh", "-c", "echo 'Daily employee report'; date; echo 'Report generated'"]
