# Enable controller first: minikube addons enable ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: employee-ingress
  namespace: employee-platform
spec:
  ingressClassName: nginx
  rules:
    - host: employees.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: employee-frontend
                port:
                  number: 80
