# Routes /api to API and all other paths to frontend.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: employee-path-ingress
  namespace: employee-platform
spec:
  ingressClassName: nginx
  rules:
    - host: employees.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: employee-api
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: employee-frontend
                port:
                  number: 80
