apiVersion: v1
kind: Pod
metadata:
  name: employee-security-context-demo
  namespace: employee-platform
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: demo
      image: busybox:1.36
      command: ["sh", "-c", "id; sleep 3600"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
