apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: employee-readonly
  namespace: employee-platform
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
