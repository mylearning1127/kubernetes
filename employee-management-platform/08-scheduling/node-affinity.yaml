apiVersion: v1
kind: Pod
metadata:
  name: employee-node-affinity-demo
  namespace: employee-platform
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/os
                operator: In
                values: ["linux"]
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 80
          preference:
            matchExpressions:
              - key: lab-role
                operator: In
                values: ["general"]
  containers:
    - name: demo
      image: nginx:1.28
