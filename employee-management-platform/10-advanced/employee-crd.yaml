# CRD extends the Kubernetes API. It does not create application Pods by itself.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: employees.learning.example.com
spec:
  group: learning.example.com
  scope: Namespaced
  names:
    plural: employees
    singular: employee
    kind: Employee
    shortNames: [emp]
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["fullName", "department"]
              properties:
                fullName:
                  type: string
                department:
                  type: string
